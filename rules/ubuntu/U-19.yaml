id: U-19
category: 파일및디렉터리관리
title: world writable 파일 점검
severity: high
os: [ubuntu]

description: |
  모든 사용자가 쓰기 가능한 파일은 임의 사용자가 내용을 변조할 수 있다.
  설정 파일이면 서비스 조작이, 스크립트면 악성 코드 삽입이 가능하다.

check:
  type: command
  command: "find /etc /opt -type f -perm -2 ! -type l 2>/dev/null | head -20"

evaluate:
  type: regex_match
  pattern: '\S'
  on_match: vulnerable
  on_empty: safe

remediation: |
  해당 파일의 others 쓰기 권한을 제거한다.
  chmod o-w <파일경로>

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드