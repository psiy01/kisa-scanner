id: U-05
category: 계정관리
title: root 외 UID 0 계정 존재 여부
severity: high
os: [ubuntu]

description: |
  UID 0은 시스템 최고 권한을 의미한다. root 외의 계정이 UID 0을 가지면
  해당 계정으로도 관리자 권한을 행사할 수 있어 백도어로 악용될 수 있다.

check:
  type: command
  command: "awk -F: '($3 == 0 && $1 != \"root\") {print $1}' /etc/passwd"

evaluate:
  type: regex_match
  pattern: '\S'
  on_match: vulnerable
  on_empty: safe

remediation: |
  root 외 UID 0 계정의 UID를 고유한 값으로 변경하거나 계정을 삭제한다.

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드