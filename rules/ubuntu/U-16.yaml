id: U-16
category: 파일및디렉터리관리
title: /etc/group 파일 소유자 및 권한 설정
severity: medium
os: [ubuntu]

description: |
  /etc/group 이 변조되면 임의 계정을 관리자 그룹에 추가해
  권한을 상승시킬 수 있다. 소유자는 root, 권한은 644 이하여야 한다.

check:
  type: command
  command: "stat -c '%a' /etc/group"

evaluate:
  type: permission_check
  max_permission: 644
  on_match: safe
  on_empty: error

remediation: |
  chown root:root /etc/group
  chmod 644 /etc/group

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드