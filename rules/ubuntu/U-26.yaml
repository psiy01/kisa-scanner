id: U-26
category: 서비스관리
title: FTP 서비스 비활성화
severity: high
os: [ubuntu]

description: |
  FTP는 인증 정보와 데이터를 평문으로 전송한다.
  파일 전송이 필요한 경우 SFTP 또는 FTPS를 사용해야 한다.

check:
  type: command
  requires: [ss]
  command: "ss -tln 2>/dev/null | awk '{print $4}' | grep -E ':21$'"

evaluate:
  type: regex_match
  pattern: '\S'
  on_match: vulnerable
  on_empty: safe

remediation: |
  FTP 서비스를 중지하고 SFTP로 대체한다.
  systemctl disable --now vsftpd

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드