id: U-31
category: 서비스관리
title: NFS 접근 통제 설정
severity: medium
os: [ubuntu]

description: |
  /etc/exports 에 everyone 공유(*)가 설정되면 임의 호스트가
  공유 디렉터리에 접근할 수 있다.

check:
  type: command
  command: "grep -vE '^\\s*#|^\\s*$' /etc/exports 2>/dev/null | grep -E '\\*|insecure|no_root_squash'"

evaluate:
  type: regex_match
  pattern: '\S'
  on_match: vulnerable
  on_empty: safe

remediation: |
  /etc/exports 에서 * 대신 특정 IP 또는 대역을 명시하고
  root_squash 옵션을 사용한다.

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드