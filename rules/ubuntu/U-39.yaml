id: U-39
category: 로그관리
title: 로그 파일 접근 권한 설정
severity: medium
os: [ubuntu]

description: |
  로그 파일에 과도한 권한이 부여되면 공격자가 침입 흔적을
  삭제하거나 변조할 수 있다.

check:
  type: command
  command: "stat -c '%a' /var/log/syslog 2>/dev/null || stat -c '%a' /var/log/messages 2>/dev/null"

evaluate:
  type: permission_check
  max_permission: 640
  on_match: safe
  on_empty: error

remediation: |
  chown syslog:adm /var/log/syslog
  chmod 640 /var/log/syslog

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드