id: U-03
category: 계정관리
title: 패스워드 최대 사용 기간 설정
severity: medium
os: [ubuntu]

description: |
  패스워드를 장기간 변경하지 않으면 유출 시 피해 기간이 길어진다.
  90일 이하로 설정하는 것을 권장한다.

check:
  type: command
  command: "grep -E '^\\s*PASS_MAX_DAYS' /etc/login.defs | grep -v '^\\s*#'"

evaluate:
  type: numeric_compare
  extract: 'PASS_MAX_DAYS\s+(\d+)'
  operator: "<="
  value: 90
  on_match: safe
  on_empty: vulnerable

remediation: |
  /etc/login.defs 파일에서 PASS_MAX_DAYS 값을 90 이하로 설정한다.

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드