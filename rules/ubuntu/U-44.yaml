id: U-44
category: 로그관리
title: 접속 기록 파일(wtmp, lastlog) 존재 여부
severity: medium
os: [ubuntu]

description: |
  wtmp와 lastlog는 접속 성공 이력을 담고 있어
  비정상 시간대 접속이나 미사용 계정의 활성화를 탐지하는 근거가 된다.

check:
  type: command
  command: "ls /var/log/wtmp /var/log/lastlog 2>/dev/null"

evaluate:
  type: regex_match
  pattern: 'wtmp'
  on_match: safe
  on_empty: vulnerable

remediation: |
  파일이 없으면 생성하고 적절한 권한을 설정한다.

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드