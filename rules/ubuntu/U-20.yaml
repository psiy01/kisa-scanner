id: U-20
category: 파일및디렉터리관리
title: 소유자가 존재하지 않는 파일 점검
severity: medium
os: [ubuntu]

description: |
  계정 삭제 후 남은 파일은 UID만 남아 소유자가 없는 상태가 된다.
  이후 동일 UID로 계정이 생성되면 새 계정이 해당 파일을 소유하게 되어
  의도치 않은 접근 권한이 부여될 수 있다.

check:
  type: command
  command: "find /home /opt /var -nouser -o -nogroup 2>/dev/null | head -20"

evaluate:
  type: regex_match
  pattern: '\S'
  on_match: vulnerable
  on_empty: safe

remediation: |
  해당 파일을 삭제하거나 적절한 소유자로 변경한다.
  chown root:root <파일경로>

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드