id: U-02
category: 계정관리
title: 패스워드 최소 길이 설정
severity: medium
os: [ubuntu]

description: |
  패스워드 최소 길이가 짧으면 무차별 대입 공격으로 쉽게 유추될 수 있다.
  KISA 가이드는 8자 이상을 권장한다.

check:
  type: command
  command: "grep -E '^\\s*PASS_MIN_LEN' /etc/login.defs | grep -v '^\\s*#'"

evaluate:
  type: numeric_compare
  extract: 'PASS_MIN_LEN\s+(\d+)'
  operator: ">="
  value: 8
  on_match: safe
  on_empty: vulnerable

remediation: |
  /etc/login.defs 파일에서 PASS_MIN_LEN 값을 8 이상으로 설정한다.

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드