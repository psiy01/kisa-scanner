id: U-29
category: 서비스관리
title: cron 파일 접근 권한 설정
severity: medium
os: [ubuntu]

description: |
  crontab 파일에 쓰기 권한이 과도하면 임의 사용자가 예약 작업을
  등록해 주기적으로 악성 명령을 실행시킬 수 있다.

check:
  type: command
  command: "stat -c '%a' /etc/crontab"

evaluate:
  type: permission_check
  max_permission: 640
  on_match: safe
  on_empty: error

remediation: |
  chown root:root /etc/crontab
  chmod 640 /etc/crontab

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드