id: U-45
category: 로그관리
title: 시스템 감사 기능(auditd) 활성화 여부
severity: medium
os: [ubuntu]

description: |
  auditd는 파일 접근, 권한 변경, 시스템 콜 수준의 상세 감사 로그를
  남긴다. rsyslog보다 세밀한 추적이 가능해 침해사고 분석에 필수적이다.

check:
  type: command
  command: "ps -eo comm | grep -x 'auditd'"

evaluate:
  type: regex_match
  pattern: '\S'
  on_match: safe
  on_empty: vulnerable

remediation: |
  apt-get install auditd
  systemctl enable --now auditd

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드