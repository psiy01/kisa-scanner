id: U-15
category: 파일및디렉터리관리
title: /etc/hosts 파일 소유자 및 권한 설정
severity: medium
os: [ubuntu]

description: |
  /etc/hosts 가 변조되면 정상 도메인을 공격자 서버로 연결시키는
  로컬 DNS 스푸핑이 가능하다. 소유자는 root, 권한은 600 이하여야 한다.

check:
  type: command
  command: "stat -c '%a' /etc/hosts"

evaluate:
  type: permission_check
  max_permission: 600
  on_match: safe
  on_empty: error

remediation: |
  chown root:root /etc/hosts
  chmod 600 /etc/hosts

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드