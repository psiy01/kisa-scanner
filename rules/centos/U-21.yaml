id: U-21
category: 파일및디렉터리관리
title: /etc/profile 파일 소유자 및 권한 설정
severity: medium
os: [ubuntu]

description: |
  모든 사용자의 로그인 시 실행되는 스크립트다. 변조되면 로그인하는
  모든 계정에서 악성 명령이 실행된다. 권한은 644 이하여야 한다.

check:
  type: command
  command: "stat -c '%a' /etc/profile"

evaluate:
  type: permission_check
  max_permission: 644
  on_match: safe
  on_empty: error

remediation: |
  chown root:root /etc/profile
  chmod 644 /etc/profile

reference: KISA 주요정보통신기반시설 기술적 취약점 분석·평가 상세가이드